<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer shield outline -->
  <path d="M256 50 L380 110 V210 C380 296 324 360 256 390 C188 360 132 296 132 210 V110 Z" fill="url(#shieldGrad)" filter="url(#glow)" opacity="0.9" />

  <!-- Inner shield detail -->
  <path d="M256 70 L360 120 V206 C360 280 310 336 256 362 C202 336 152 280 152 206 V120 Z" fill="#090d16" opacity="0.95" />

  <!-- Medical Cross -->
  <path d="M234 140 H278 V190 H328 V234 H278 V284 H234 V234 H184 V190 H234 Z" fill="url(#crossGrad)" />

  <!-- ECG Heartbeat Pulse Line -->
  <path d="M132 212 H192 L210 178 L232 248 L260 144 L282 234 L300 198 L320 212 H380" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Text Branding: HALLMARK MEDICAL CENTER -->
  <text x="256" y="426" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="4">HALLMARK</text>
  <text x="256" y="456" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="20" letter-spacing="3">MEDICAL CENTER</text>
</svg>
